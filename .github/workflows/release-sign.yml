name: release-sign

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
      package_run_id:
        description: package-installers workflow run ID containing installer artifacts
        required: true
      expected_head_sha:
        description: Git commit SHA that the package-installers run must have built
        required: true
      expected_ref:
        description: Branch or tag ref name that the package-installers run must have built
        required: true
      expected_chromium_workflow_path:
        description: Chromium build workflow path recorded by package-installers
        required: true
      expected_chromium_head_sha:
        description: Chromium build commit SHA recorded by package-installers
        required: true
      expected_chromium_ref:
        description: Chromium build branch or tag ref recorded by package-installers
        required: true
      expected_updater_root_sha256:
        description: SHA-256 of the signed production updater root.json
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: release-sign-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  tuf-and-linux-signatures:
    name: TUF metadata and Linux detached signatures
    runs-on: ubuntu-22.04
    environment: release-signing
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Validate package run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.package_run_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_REF: ${{ inputs.expected_ref }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/${EXPECTED_REPOSITORY}/actions/runs/${RUN_ID}" > "$RUNNER_TEMP/package-run.json"
          python3 - <<'PY'
          import json
          import os
          import sys

          with open(os.path.join(os.environ["RUNNER_TEMP"], "package-run.json")) as f:
              run = json.load(f)

          expected_repo = os.environ["EXPECTED_REPOSITORY"].lower()
          errors = []
          if run.get("name") != "package-installers":
              errors.append(f"workflow name is {run.get('name')!r}")
          if not str(run.get("path", "")).endswith(".github/workflows/package-installers.yml"):
              errors.append(f"workflow path is {run.get('path')!r}")
          if run.get("conclusion") != "success":
              errors.append(f"conclusion is {run.get('conclusion')!r}")
          if run.get("head_sha") != os.environ["EXPECTED_HEAD_SHA"]:
              errors.append(
                  f"head_sha is {run.get('head_sha')!r}, "
                  f"expected {os.environ['EXPECTED_HEAD_SHA']!r}"
              )
          if run.get("head_branch") != os.environ["EXPECTED_REF"]:
              errors.append(
                  f"head_branch is {run.get('head_branch')!r}, "
                  f"expected {os.environ['EXPECTED_REF']!r}"
              )
          repo = (run.get("repository") or {}).get("full_name", "").lower()
          if repo != expected_repo:
              errors.append(f"repository is {repo!r}, expected {expected_repo!r}")

          if errors:
              print("Package run provenance validation failed:", file=sys.stderr)
              for error in errors:
                  print(f"  - {error}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Download installer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.package_run_id }}
        run: gh run download "$RUN_ID" --dir "$RUNNER_TEMP/packages"

      - name: Materialize expected Linux release public key
        env:
          PHLINK_GPG_PUBLIC: ${{ secrets.PHLINK_GPG_PUBLIC }}
        run: |
          test -n "$PHLINK_GPG_PUBLIC"
          printf '%s' "$PHLINK_GPG_PUBLIC" > "$RUNNER_TEMP/release.gpg"

      - name: Verify package provenance and platform signing gates
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          EXPECTED_CHROMIUM_WORKFLOW_PATH: ${{ inputs.expected_chromium_workflow_path }}
          EXPECTED_CHROMIUM_HEAD_SHA: ${{ inputs.expected_chromium_head_sha }}
          EXPECTED_CHROMIUM_REF: ${{ inputs.expected_chromium_ref }}
          EXPECTED_UPDATER_ROOT_SHA256: ${{ inputs.expected_updater_root_sha256 }}
          EXPECTED_RELEASE_GPG: ${{ runner.temp }}/release.gpg
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys

          packages_dir = os.path.join(os.environ["RUNNER_TEMP"], "packages")
          version = os.environ["VERSION"]
          expected_root_sha256 = os.environ["EXPECTED_UPDATER_ROOT_SHA256"].lower()

          def sha256_file(path):
            h = hashlib.sha256()
            with open(path, "rb") as f:
              for chunk in iter(lambda: f.read(1 << 20), b""):
                h.update(chunk)
            return h.hexdigest()

          expected_artifacts = {
            "macos": {
              f"phlink-{version}-mac-arm64.dmg",
              f"phlink-{version}-mac-arm64-update.zip",
            },
            "linux": {
              f"phlink-{version}-linux-x86_64.AppImage",
              f"phlink-{version}-linux-x86_64-update",
              f"phlink_{version}_amd64.deb",
              f"phlink-{version}-1.x86_64.rpm",
            },
            "windows": {
              f"phlink-{version}-win-x64.msi",
              f"phlink-{version}-win-x64-update.exe",
            },
          }
          manifests = {}
          artifacts = {}
          for root, _, files in os.walk(packages_dir):
            for name in files:
              path = os.path.join(root, name)
              if name.startswith("package-provenance-") and name.endswith(".json"):
                with open(path) as f:
                  manifest = json.load(f)
                manifests[manifest.get("platform", "")] = manifest
              else:
                artifacts[name] = path

          errors = []
          expected_platforms = {"macos", "linux", "windows"}
          if set(manifests) != expected_platforms:
            errors.append(f"provenance platforms are {sorted(manifests)}, expected {sorted(expected_platforms)}")

          for platform, names in expected_artifacts.items():
            manifest = manifests.get(platform)
            if not manifest:
              continue
            if str(manifest.get("package_run_id")) != os.environ["PACKAGE_RUN_ID"]:
              errors.append(f"{platform}: package_run_id mismatch")
            chromium = manifest.get("chromium_run") or {}
            if chromium.get("workflow_path") != os.environ["EXPECTED_CHROMIUM_WORKFLOW_PATH"]:
              errors.append(f"{platform}: chromium workflow_path mismatch")
            if chromium.get("head_sha") != os.environ["EXPECTED_CHROMIUM_HEAD_SHA"]:
              errors.append(f"{platform}: chromium head_sha mismatch")
            if chromium.get("ref") != os.environ["EXPECTED_CHROMIUM_REF"]:
              errors.append(f"{platform}: chromium ref mismatch")
            if chromium.get("repository", "").lower() != os.environ["EXPECTED_REPOSITORY"].lower():
              errors.append(f"{platform}: chromium repository mismatch")

            manifest_artifacts = manifest.get("artifacts") or {}
            if set(manifest_artifacts) != names:
              errors.append(
                f"{platform}: manifest artifacts are {sorted(manifest_artifacts)}, "
                f"expected {sorted(names)}"
              )
            for name in names:
              path = artifacts.get(name)
              if not path:
                errors.append(f"{platform}: missing downloaded artifact {name}")
                continue
              digest = sha256_file(path)
              if manifest_artifacts.get(name) != digest:
                errors.append(f"{platform}: digest mismatch for {name}")

            if manifest.get("updater_root_sha256") != expected_root_sha256:
              errors.append(f"{platform}: updater root does not match expected production root")
            if manifest.get("phlink_product_version") != version:
              errors.append(f"{platform}: phlink_product_version does not match release version")
            if manifest.get("phlink_updater_dev_root") is not False:
              errors.append(f"{platform}: phlink_updater_dev_root was not false")

            if platform == "linux":
              expected_release_gpg_sha256 = sha256_file(os.environ["EXPECTED_RELEASE_GPG"])
              if manifest.get("release_gpg_sha256") != expected_release_gpg_sha256:
                errors.append("linux: release_gpg_sha256 does not match PHLINK_GPG_PUBLIC")

          mac_signing = (manifests.get("macos") or {}).get("platform_signing") or {}
          for key in ("codesign_verified", "gatekeeper_verified", "notarization_checked"):
            if mac_signing.get(key) is not True:
              errors.append(f"macos: platform signing gate {key} is not true")
          win_signing = (manifests.get("windows") or {}).get("platform_signing") or {}
          if win_signing.get("authenticode_verified") is not True:
            errors.append("windows: Authenticode verification gate is not true")

          if errors:
            print("Package provenance validation failed:", file=sys.stderr)
            for error in errors:
              print(f"  - {error}", file=sys.stderr)
            sys.exit(1)
          PY

      - name: Flatten artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifacts"
          expected=(
            "phlink-${VERSION}-mac-arm64.dmg"
            "phlink-${VERSION}-mac-arm64-update.zip"
            "phlink-${VERSION}-linux-x86_64.AppImage"
            "phlink-${VERSION}-linux-x86_64-update"
            "phlink_${VERSION}_amd64.deb"
            "phlink-${VERSION}-1.x86_64.rpm"
            "phlink-${VERSION}-win-x64.msi"
            "phlink-${VERSION}-win-x64-update.exe"
          )
          for name in "${expected[@]}"; do
            mapfile -t matches < <(find "$RUNNER_TEMP/packages" -type f -name "$name" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "expected exactly one artifact named $name, found ${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "$RUNNER_TEMP/release-artifacts/$name"
          done
          find "$RUNNER_TEMP/release-artifacts" -maxdepth 1 -type f -print

      - name: Materialize signing keys
        env:
          PHLINK_TARGETS_KEY: ${{ secrets.PHLINK_TARGETS_KEY }}
          PHLINK_SNAPSHOT_KEY: ${{ secrets.PHLINK_SNAPSHOT_KEY }}
          PHLINK_TIMESTAMP_KEY: ${{ secrets.PHLINK_TIMESTAMP_KEY }}
          PHLINK_GPG_SECRET: ${{ secrets.PHLINK_GPG_SECRET }}
        run: |
          test -n "$PHLINK_TARGETS_KEY"
          test -n "$PHLINK_SNAPSHOT_KEY"
          test -n "$PHLINK_TIMESTAMP_KEY"
          test -n "$PHLINK_GPG_SECRET"
          umask 077
          printf '%s' "$PHLINK_TARGETS_KEY" > "$RUNNER_TEMP/targets.key"
          printf '%s' "$PHLINK_SNAPSHOT_KEY" > "$RUNNER_TEMP/snapshot.key"
          printf '%s' "$PHLINK_TIMESTAMP_KEY" > "$RUNNER_TEMP/timestamp.key"
          printf '%s' "$PHLINK_GPG_SECRET" > "$RUNNER_TEMP/release.gpg.secret"

      - name: Sign release metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/release/sign-release.sh \
            "$RUNNER_TEMP/release-artifacts" \
            "$VERSION" \
            "$RUNNER_TEMP/targets.key" \
            "$RUNNER_TEMP/snapshot.key" \
            "$RUNNER_TEMP/timestamp.key" \
            "$RUNNER_TEMP/release.gpg.secret"

      - name: Verify Linux detached signatures
        run: |
          GNUPGHOME="$RUNNER_TEMP/phlink-verify-gpg"
          export GNUPGHOME
          mkdir -p "$GNUPGHOME"
          gpg --batch --import "$RUNNER_TEMP/release.gpg"
          for artifact in "$RUNNER_TEMP/release-artifacts"/*.AppImage \
                          "$RUNNER_TEMP/release-artifacts"/*.deb \
                          "$RUNNER_TEMP/release-artifacts"/*.rpm; do
            gpg --batch --verify "${artifact}.sig" "$artifact"
          done

      - name: Upload signed metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phlink-${{ inputs.version }}-signed-release-metadata
          path: |
            ${{ runner.temp }}/release-artifacts/targets.json
            ${{ runner.temp }}/release-artifacts/snapshot.json
            ${{ runner.temp }}/release-artifacts/timestamp.json
            ${{ runner.temp }}/release-artifacts/*.sig
          if-no-files-found: error
